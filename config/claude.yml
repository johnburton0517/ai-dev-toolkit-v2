  description: Enterprise-governed AI coding assistant plugins for Claude Code
  owner:
    name: John Burton
    email: john.burton0517@example.com
HEADER: |
  > **CDK** — Core Development Kit skill. Invoke as `/cdk:{{name}}` in Claude Code.
